[package]
name = "rust-args-parser"
version = "3.0.0"
description = "Tiny, fast, callback-based CLI argument parser for Rust"
rust-version = "1.74"
edition = "2021"
homepage = "https://github.com/milchinskiy/rust-args-parser"
repository = "https://github.com/milchinskiy/rust-args-parser"
documentation = "https://docs.rs/rust-args-parser"
readme = "README.md"
keywords = ["cli", "command-line", "args", "parser"]
categories = ["command-line-interface"]
license = "MIT OR Apache-2.0"

[lints.clippy]
pedantic = "warn"
correctness = "warn"
complexity = "warn"
perf = "warn"
nursery = "warn"
style = "warn"
cargo = "warn"
redundant_pub_crate = "warn"
missing_const_for_fn = { level = "allow", priority = 1 }

[workspace]
members = ["derive"]
resolver = "2"

[features]
default = ["help", "suggest", "color"]
help = []                              # help renderer (wrapping, sections, optional colors)
suggest = []                           # did-you-mean distance util
color = []
derive = ["dep:rust-args-parser-derive"] # Derive macros and typed event bindings

[dependencies]
rust-args-parser-derive = { path = "derive", version = "0.2.0", optional = true }

[[example]]
name = "derive_basic"
required-features = ["derive"]

[[example]]
name = "derive_subcommands"
required-features = ["derive"]
