[package]
name = "rust-args-parser-derive"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Implementation of rust-args-parser's optional derive feature"
repository = "https://github.com/milchinskiy/rust-args-parser"
readme = "README.md"
keywords = ["cli", "command-line", "derive", "parser"]
categories = ["command-line-interface"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
proc-macro2 = "1"
