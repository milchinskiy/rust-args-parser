---
name: Test, Release & (optional) Publish
on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v2.0.1)
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  test:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Show Rust and Clippy versions
        run: |
          rustc -Vv
          cargo clippy --version
      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets
      - name: Build (lib + examples)
        run: |
          cargo build --locked --lib --examples --verbose
      - name: Test (lib + unit/integration)
        run: |
          cargo test --locked --workspace --all-features --all-targets --verbose
          cargo test --locked --no-default-features --verbose
  msrv:
    name: Rust 1.74
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust (1.74)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.74.0
      - name: Test on MSRV
        run: cargo test --locked --workspace --all-features --all-targets
  release:
    name: Create GitHub Release
    needs: [test, msrv]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create GitHub Release (auto notes)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
  publish-dry-run:
    name: Cargo publish — dry run
    needs: [test, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0  # need tags
      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Read crate name & version
        id: meta
        run: |
          JSON=$(cargo read-manifest --manifest-path Cargo.toml)
          echo "name=$(echo "$JSON" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$JSON" | jq -r '.version')" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches version
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.meta.outputs.version }}"
          if [[ "$RELEASE_TAG" != "$EXPECTED" ]]; then
            echo "::error::Requested tag '$RELEASE_TAG' does not match crate version '$EXPECTED'."
            exit 1
          fi
          if ! TAG_SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"); then
            echo "::error::Tag '$RELEASE_TAG' was not found in the checkout."
            exit 1
          fi
          HEAD=$(git rev-parse HEAD)
          echo "Checkout: $HEAD"
          echo "Tag $RELEASE_TAG: $TAG_SHA"
          if [[ "$HEAD" != "$TAG_SHA" ]]; then
            echo "::error::Tag '$RELEASE_TAG' does not point to the checked-out commit."
            exit 1
          fi
          echo "Tag check OK."
      - name: Ensure version not already published (crates.io)
        run: |
          set -euo pipefail
          NAME='${{ steps.meta.outputs.name }}'
          VER='${{ steps.meta.outputs.version }}'
          UA="${GITHUB_REPOSITORY}@${GITHUB_RUN_ID} (contact: ${GITHUB_ACTOR}@users.noreply.github.com)"
          URL="https://crates.io/api/v1/crates/${NAME}/${VER}"
          # Query version endpoint; expect 200 if exists, 404 if not
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/json" \
            -H "User-Agent: $UA" \
            "$URL" || true)
          case "$CODE" in
            200)
              echo "::error::Version $NAME@$VER already exists on crates.io"; exit 1 ;;
            404)
              echo "Version availability OK." ;;
            403|429)
              echo "::warning::crates.io returned $CODE (forbidden/rate limited). Skipping API probe; will rely on cargo publish --dry-run." ;;
            *)
              echo "::warning::Unexpected HTTP $CODE from crates.io; will rely on cargo publish --dry-run." ;;
          esac
      - name: Package crate
        run: |
          cargo package --locked
      - name: Publish (dry-run)
        run: |
          cargo publish --locked --dry-run
  publish-live:
    name: Cargo publish — live (requires approval)
    needs: publish-dry-run
    # Only for stable tags (skip pre-releases like v1.2.0-rc1)
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |-
          cargo publish --locked
