name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Tests, format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Show Rust and Clippy versions
        run: |
          rustc -Vv
          cargo clippy --version
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-features --all-targets
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features derive
      - run: cargo clippy --locked --workspace --all-features --all-targets

  msrv:
    name: Rust 1.74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.74.0
      - run: cargo test --locked --workspace --all-features --all-targets
